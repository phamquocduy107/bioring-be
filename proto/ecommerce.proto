  string id = 1;
  string action = 2;
  double extraFee = 3;
  string managerNote = 4;
  string managerId = 5;
}

message ConfirmWarrantyClaimRequest {
  string id = 1;
  string userId = 2;
}

message InitiateClaimPaymentRequest {
  string claimId = 1;
  string userId = 2;
  string returnUrl = 3;
  string cancelUrl = 4;
}

message ReceiveServiceTicketRequest {
  string claimId = 1;
  string conditionNote = 2;
  repeated string receivedImages = 3;

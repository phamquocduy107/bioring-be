syntax = "proto3";

package ecommerce;

service EcommerceService {
  // Customers (B4)
  rpc ListCustomers (ListCustomersRequest) returns (ListCustomersResponse);

  // Catalog
  rpc GetProducts (GetProductsRequest) returns (GetProductsResponse);
  rpc GetProductById (GetProductByIdRequest) returns (GetProductByIdResponse);
  rpc GetMaterials (Empty) returns (GetMaterialsResponse);
  rpc GetGemstones (Empty) returns (GetGemstonesResponse);

  // Design Drafts
  rpc CreateDesignDraft (CreateDesignDraftRequest) returns (CreateDesignDraftResponse);
  rpc GetDesignDraftByCode (GetDesignDraftByCodeRequest) returns (GetDesignDraftByCodeResponse);
  rpc GetMyDrafts (GetMyDraftsRequest) returns (GetMyDraftsResponse);
  rpc UpdateDesignDraft (UpdateDesignDraftRequest) returns (UpdateDesignDraftResponse);
  rpc ClaimDesignDraft (ClaimDesignDraftRequest) returns (ClaimDesignDraftResponse);

  // Engraving
  rpc CreateEngraving (CreateEngravingRequest) returns (CreateEngravingResponse);
  rpc UpdateEngravingVersionConfig (UpdateEngravingVersionConfigRequest) returns (UpdateEngravingVersionConfigResponse);
  rpc ResubmitEngravingVersion (ResubmitEngravingVersionRequest) returns (ResubmitEngravingVersionResponse);
  rpc GetMyEngravings (GetMyEngravingsRequest) returns (GetMyEngravingsResponse);
  rpc GetEngraving (GetEngravingRequest) returns (GetEngravingResponse);

  // Orders
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc GetMyOrders (GetMyOrdersRequest) returns (GetMyOrdersResponse);
  rpc ReviewOrder (ReviewOrderRequest) returns (ReviewOrderResponse);

  // Orders — MF-03
  rpc SubmitOrder (SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc AttachBiometric (AttachBiometricRequest) returns (AttachBiometricResponse);

  // Payments
  rpc InitiatePayment (InitiatePaymentRequest) returns (InitiatePaymentResponse);
  rpc HandlePayOSWebhook (PayOSWebhookRequest) returns (PayOSWebhookResponse);
  rpc CancelPayment (CancelPaymentRequest) returns (CancelPaymentResponse);
  rpc CancelOrder (CancelOrderRequest) returns (GetOrderResponse);

  // Manual payment (POS)
  rpc ManualPayment (ManualPaymentRequest) returns (ManualPaymentResponse);
  rpc GetPaymentStatus (GetPaymentStatusRequest) returns (GetPaymentStatusResponse);

// Production
rpc AssignJeweler (AssignJewelerRequest) returns (AssignJewelerResponse);
rpc UpdateProductionStatus (UpdateProductionStatusRequest) returns (UpdateProductionStatusResponse);
rpc GetProductionTasks (GetProductionTasksRequest) returns (GetProductionTasksResponse);

  // QR Memory
  rpc UpdateQrMemory (UpdateQrMemoryRequest) returns (UpdateQrMemoryResponse);
  rpc GetQrMemory (GetQrMemoryRequest) returns (GetQrMemoryResponse);
  rpc ActivateQrMemory (ActivateQrMemoryRequest) returns (ActivateQrMemoryResponse);

  // Card Themes
  rpc GetCardThemes (GetCardThemesRequest) returns (GetCardThemesResponse);
  rpc GetCardTheme (GetCardThemeRequest) returns (GetCardThemeResponse);
  rpc CreateCardTheme (CreateCardThemeRequest) returns (CreateCardThemeResponse);
  rpc UpdateCardTheme (UpdateCardThemeRequest) returns (UpdateCardThemeResponse);
  rpc DeleteCardTheme (DeleteCardThemeRequest) returns (DeleteCardThemeResponse);

  // MF-05: Delivery, Pickup & QR Memory
  rpc QcAcceptOrder (QcAcceptOrderRequest) returns (GetOrderResponse);
  rpc InitiateDelivery (InitiateDeliveryRequest) returns (DeliveryResponse);
  rpc UpdateShipmentStatus (UpdateShipmentStatusRequest) returns (GetOrderResponse);
  rpc GetDeliveryInfo (GetDeliveryInfoRequest) returns (DeliveryResponse);
  rpc GetWarrantyInfo (GetWarrantyInfoRequest) returns (WarrantyResponse);
  rpc GetProductionInfo (GetProductionInfoRequest) returns (GetProductionInfoResponse);
  rpc LookupOrder (OrderLookupRequest) returns (GetOrderResponse);

  // Guest (MF-04: Walk-in)
  rpc CreateGuestSession (CreateGuestSessionRequest) returns (CreateGuestSessionResponse);
  rpc CreateGuestOrder (CreateGuestOrderRequest) returns (CreateGuestOrderResponse);
  rpc GetGuestSession (GetGuestSessionRequest) returns (GetGuestSessionResponse);
  rpc GuestSubmitOrder (GuestSubmitOrderRequest) returns (GuestSubmitOrderResponse);
  rpc GuestUpdateEngravingConfig (GuestUpdateEngravingConfigRequest) returns (GuestUpdateEngravingConfigResponse);
  rpc GuestUpdateQrMemory (GuestUpdateQrMemoryRequest) returns (GuestUpdateQrMemoryResponse);
  rpc GuestGetOrder (GuestGetOrderRequest) returns (GetOrderResponse);
  rpc GuestInitiatePayment (GuestInitiatePaymentRequest) returns (GuestInitiatePaymentResponse);
  rpc GuestSetShippingInfo (GuestSetShippingInfoRequest) returns (GuestSetShippingInfoResponse);

  // Capture Session (P4)
  rpc CreateCaptureSession (CreateCaptureSessionRequest) returns (CreateCaptureSessionResponse);
  rpc CompleteCaptureSession (CompleteCaptureSessionRequest) returns (CreateCaptureSessionResponse);
  rpc GetCaptureSessions (GetCaptureSessionsRequest) returns (GetCaptureSessionsResponse);
  rpc GetCaptureSession (GetCaptureSessionRequest) returns (CreateCaptureSessionResponse);

  // Admin Dashboard (P5)
  rpc GetDashboardSummary (Empty) returns (DashboardSummaryResponse);
  rpc GetOrdersByStatus (Empty) returns (OrdersByStatusResponse);
  rpc GetRevenueTimeline (RevenueTimelineRequest) returns (RevenueTimelineResponse);
  rpc GetTopProducts (TopProductsRequest) returns (TopProductsResponse);

  // MF-06: Warranty & Service Claim
  rpc CreateWarrantyClaim (CreateWarrantyClaimRequest) returns (CreateWarrantyClaimResponse);
  rpc CreateWarrantyClaimByLookup (CreateWarrantyClaimByLookupRequest) returns (CreateWarrantyClaimResponse);
  rpc GetWarrantyClaim (GetWarrantyClaimRequest) returns (GetWarrantyClaimResponse);
  rpc GetMyWarrantyClaims (GetMyWarrantyClaimsRequest) returns (GetMyWarrantyClaimsResponse);
  rpc ReviewWarrantyClaim (ReviewWarrantyClaimRequest) returns (GetWarrantyClaimResponse);
  rpc ConfirmWarrantyClaim (ConfirmWarrantyClaimRequest) returns (GetWarrantyClaimResponse);
  rpc InitiateClaimPayment (InitiateClaimPaymentRequest) returns (InitiatePaymentResponse);
  rpc ReceiveServiceTicket (ReceiveServiceTicketRequest) returns (GetWarrantyClaimResponse);
  rpc CompleteServiceTicket (CompleteServiceTicketRequest) returns (GetWarrantyClaimResponse);
  rpc ReturnWarrantyClaim (ReturnWarrantyClaimRequest) returns (GetWarrantyClaimResponse);

  // Customer lookup (Staff Dashboard)
  rpc LookupCustomer (LookupCustomerRequest) returns (LookupCustomerResponse);

  // FE API Gaps — Transactions (B1 + B2)
  rpc ListPayments (ListPaymentsRequest) returns (ListPaymentsResponse);
  rpc GetTransactionOverview (Empty) returns (TransactionOverviewResponse);

  // FE API Gaps — Monthly Growth (B3)
  rpc GetMonthlyGrowth (GetMonthlyGrowthRequest) returns (GetMonthlyGrowthResponse);

  // FE API Gaps — Audit Logs (B5)
  rpc ListAuditLogs (ListAuditLogsRequest) returns (ListAuditLogsResponse);

  // FE API Gaps — Devices (B6)
  rpc ListDevices (ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDevice (GetDeviceRequest) returns (GetDeviceResponse);
  rpc CreateDevice (CreateDeviceRequest) returns (MutateDeviceResponse);
  rpc UpdateDevice (UpdateDeviceRequest) returns (MutateDeviceResponse);
  rpc DeleteDevice (DeleteDeviceRequest) returns (DeleteDeviceResponse);

  // FE API Gaps — Engraving Cancel (B7)
  rpc CancelEngraving (CancelEngravingRequest) returns (CancelEngravingResponse);

  // FE API Gaps — Product CRUD (B8)
  rpc CreateProduct (CreateProductRequest) returns (MutateProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (MutateProductResponse);
  rpc DeleteProduct (DeleteProductRequest) returns (MutateProductResponse);
}

// ===== Messages =====

message ClaimDesignDraftRequest {
  string designCode = 1;
  string userId = 2;
}

message ClaimDesignDraftResponse {
  DesignDraft draft = 1;
  Engraving engraving = 2;
  EngravingVersion engravingVersion = 3;
}

// ===== Generic =====
message Empty {}

// ===== Catalog =====
message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string baseMaterialId = 4;
  double basePrice = 5;
  string thumbnailUrl = 6;
  string model3dUrl = 7;
  repeated Material availableMaterials = 8;
  repeated Gemstone availableGemstones = 9;
}

message GetProductsRequest {
  int32 page = 1;
  int32 limit = 2;
  string materialId = 3;
  double maxPrice = 4;
}

message GetProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetProductByIdRequest {
  string id = 1;
}

message GetProductByIdResponse {
  Product product = 1;
}

message Material {
  string id = 1;
  string name = 2;
  string purity = 3;
  string color = 4;
  double currentPricePerGram = 5;
}

message GetMaterialsResponse {
  repeated Material materials = 1;
}

message Gemstone {
  string id = 1;
  string type = 2;
  double carat = 3;
  string cut = 4;
  string color = 5;
  string clarity = 6;
  string certificationCode = 7;
  double price = 8;
  bool isAvailable = 9;
}

message GetGemstonesResponse {
  repeated Gemstone gemstones = 1;
}

// ===== Design Draft =====
message DesignDraft {
  string id = 1;
  string userId = 2;
  string productId = 3;
  string designCode = 4;
  string designSource = 5;
  string ringStyle = 6;
  string ringShape = 7;
  string ringSize = 8;
  string selectedMaterialId = 9;
  string selectedGemstoneId = 10;
  string customizationConfig = 11;
  double estimatedPrice = 12;
  string status = 13;
  string createdAt = 14;
  string updatedAt = 15;
  Product product = 16;
  Material selectedMaterial = 17;
  Gemstone selectedGemstone = 18;
}

message GetMyDraftsRequest {
  string guestSessionId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetMyDraftsResponse {
  repeated DesignDraft drafts = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message CreateDesignDraftRequest {
  string productId = 1;
  string ringStyle = 2;
  string ringShape = 3;
  string ringSize = 4;
  string selectedMaterialId = 5;
  string selectedGemstoneId = 6;
  string customizationConfig = 7;
  string guestSessionId = 8;
}

message CreateDesignDraftResponse {
  DesignDraft draft = 1;
  string designCode = 2;
}

message GetDesignDraftByCodeRequest {
  string designCode = 1;
}

message GetDesignDraftByCodeResponse {
  DesignDraft draft = 1;
}

message UpdateDesignDraftRequest {
  string id = 1;
  string ringStyle = 2;
  string ringShape = 3;
  string ringSize = 4;
  string selectedMaterialId = 5;
  string selectedGemstoneId = 6;
  string customizationConfig = 7;
  string guestSessionId = 8;
}

message UpdateDesignDraftResponse {
  DesignDraft draft = 1;
}

// === Engraving ===
message CreateEngravingRequest {
  string userId = 1;
  string productId = 2;
}

message CreateEngravingResponse {
  Engraving engraving = 1;
  EngravingVersion engravingVersion = 2;
  string qrCode = 3;
}

message UpdateEngravingVersionConfigRequest {
  string engravingVersionId = 1;
  string customizationConfig = 2;
  string selectedMaterialId = 3;
  string selectedGemstoneId = 4;
  string ringSize = 5;
  string ringStyle = 6;
  string ringShape = 7;
  string previewImageUrl = 8;
  string model3dUrl = 9;
  string productionFileUrl = 10;
  string selectedBiometrics = 12;
}

message ResubmitEngravingVersionRequest {
  string engravingVersionId = 1;
}

message ResubmitEngravingVersionResponse {
  EngravingVersion version = 1;
  string orderId = 2;
  string orderStatus = 3;
}

message UpdateEngravingVersionConfigResponse {
  EngravingVersion version = 1;
  string orderId = 2;
  string orderStatus = 3;
}

message GetMyEngravingsRequest {
  string userId = 1;
  int32 page = 2;
  int32 limit = 3;
  string status = 4;
  string orderId = 5;
}

message GetMyEngravingsResponse {
  repeated Engraving engravings = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetEngravingRequest {
  string id = 1;
}

message GetEngravingResponse {
  Engraving engraving = 1;
}

// === Orders ===
message Order {
  string id = 1;
  string orderCode = 2;
  string userId = 3;
  string designDraftId = 4;
  string captureRoute = 5;
  string designSource = 6;
  string status = 7;
  double subtotal = 8;
  double serviceFee = 9;
  double extraFee = 10;
  double discountAmount = 11;
  double totalPrice = 12;
  double paidAmount = 13;
  double remainingAmount = 14;
  string note = 15;
  string createdAt = 16;
  string updatedAt = 17;
  DesignDraft designDraft = 18;
  repeated Payment payments = 19;
  Engraving engraving = 20;
}

message CreateOrderRequest {
  string engravingId = 1;
  string userId = 2;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message GetMyOrdersRequest {
  int32 page = 1;
  int32 limit = 2;
  string userId = 3;
}

message GetMyOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ReviewOrderRequest {
  string id = 1;
  string action = 2;
  string note = 3;
  string managerId = 4;
}

message ReviewOrderResponse {
  Order order = 1;
}

message SubmitOrderRequest {
  string id = 1;
}

message SubmitOrderResponse {
  Order order = 1;
}

message AttachBiometricRequest {
  string engravingId = 1;
  string biometricType = 2;
  string rawFileUrl = 3;
  string extraData = 4;
}

message AttachBiometricResponse {
  EngravingBioMetric biometric = 1;
}

// === Engraving messages ===
message Engraving {
  string id = 1;
  string orderId = 2;
  string userId = 3;
  string productId = 4;
  string uniqueProductId = 5;
  string approvedVersionId = 6;
  string status = 7;
  repeated EngravingVersion versions = 8;
  repeated EngravingBioMetric biometrics = 9;
  QrMemory qrMemory = 10;
  EngravingVersion currentVersion = 11;
}

message EngravingVersion {
  string id = 1;
  string engravingId = 2;
  int32 versionNumber = 3;
  string selectedMaterialId = 4;
  string selectedGemstoneId = 5;
  string ringSize = 6;
  string ringStyle = 7;
  string ringShape = 8;
  string customizationConfig = 9;
  string selectedBiometrics = 10;
  string status = 11;
  string managerId = 12;
  string managerNote = 13;
  string reviewedAt = 14;
  string createdAt = 15;
  Material selectedMaterial = 16;
  Gemstone selectedGemstone = 17;
}

message EngravingBioMetric {
  string id = 1;
  string engravingId = 2;
  string biometricType = 3;
  string requiredChannel = 4;
  string rawFileUrl = 5;
  string processedSvgUrl = 6;
  string extraData = 7;
  string status = 8;
}

// === Payment ===
message Payment {
  string id = 1;
  string orderId = 2;
  string paymentPhase = 3;
  double amount = 4;
  string method = 5;
  string status = 6;
  string payosTransactionId = 7;
  string paymentUrl = 8;
  string paidAt = 9;
  string createdAt = 10;
}

message InitiatePaymentRequest {
  string orderId = 1;
  string paymentPhase = 2;
  string returnUrl = 3;
  string cancelUrl = 4;
  string userId = 5;
}

message InitiatePaymentResponse {
  Payment payment = 1;
  string paymentUrl = 2;
  string qrCode = 3;
}

message PayOSWebhookRequest {
  string webhookBody = 1;
}

message PayOSWebhookResponse {
  bool success = 1;
}

message CancelPaymentRequest {
  string orderId = 1;
  string userId = 2;
}

message CancelPaymentResponse {
  bool success = 1;
  string orderCode = 2;
}

// === Manual Payment (POS) ===
message ManualPaymentRequest {
  string orderId = 1;
  string paymentPhase = 2;
  double amount = 3;
  string receivedBy = 4;
}

message ManualPaymentResponse {
  Payment payment = 1;
  Order order = 2;
}

message GetPaymentStatusRequest { string orderId = 1; }

message PaymentPhaseInfo {
  string phase = 1;
  string status = 2;
  double amount = 3;
  string method = 4;
  string paidAt = 5;
}

message GetPaymentStatusResponse {
  string orderId = 1;
  string orderCode = 2;
  double totalPrice = 3;
  double paidAmount = 4;
  double remainingAmount = 5;
  repeated PaymentPhaseInfo phases = 6;
}

// === Customer Lookup ===
message LookupCustomerRequest { string email = 1; }

message LookupCustomerResponse {
  string type = 1;
  MemberInfo member = 2;
  GuestInfo guest = 3;
}

message MemberInfo {
  string id = 1;
  string fullName = 2;
  string email = 3;
  string phone = 4;
  int32 orderCount = 5;
  int32 activeOrders = 6;
}

message GuestInfo {
  string id = 1;
  string guestCode = 2;
  string fullName = 3;
  string phone = 4;
  string email = 5;
  int32 orderCount = 6;
  string lastOrderAt = 7;
  string convertedAt = 8;
}

message CancelOrderRequest {
  string id = 1;
  string reason = 2;
}

// === Production ===
message ProductionTask {
  string id = 1;
  string orderId = 2;
  string engravingId = 3;
  string assignedJewelerId = 4;
  string assignedJewelerName = 5;
  string status = 6;
  string note = 7;
  string startedAt = 8;
  string completedAt = 9;
  string createdAt = 10;
  string taskName = 11;
  string taskDescription = 12;
}

message AssignJewelerRequest {
  string orderId = 1;
  string jewelerId = 2;
}

message AssignJewelerResponse {
  ProductionTask task = 1;
}

message UpdateProductionStatusRequest {
  string taskId = 1;
  string status = 2;
  string note = 3;
}

message UpdateProductionStatusResponse {
  ProductionTask task = 1;
}

message GetProductionTasksRequest {
  int32 page = 1;
  int32 limit = 2;
  string status = 3;
  string orderId = 4;
  string jewelerId = 5;
}

message GetProductionTasksResponse {
  repeated ProductionTask data = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 lastPage = 5;
}

// === QR Memory ===
message CardTheme {
  string id = 1;
  string themeCode = 2;
  string name = 3;
  string defaultBgUrl = 4;
  string styleConfig = 5;
  bool isActive = 6;
  string createdAt = 7;
}

message GetCardThemesRequest {
  int32 page = 1;
  int32 limit = 2;
}

message GetCardThemesResponse {
  repeated CardTheme cardThemes = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetCardThemeRequest {
  string id = 1;
}

message GetCardThemeResponse {
  CardTheme cardTheme = 1;
}

message CreateCardThemeRequest {
  string themeCode = 1;
  string name = 2;
  string defaultBgUrl = 3;
  string styleConfig = 4;
}

message CreateCardThemeResponse {
  CardTheme cardTheme = 1;
}

message UpdateCardThemeRequest {
  string id = 1;
  string themeCode = 2;
  string name = 3;
  string defaultBgUrl = 4;
  string styleConfig = 5;
}

message UpdateCardThemeResponse {
  CardTheme cardTheme = 1;
}

message DeleteCardThemeRequest {
  string id = 1;
}

message DeleteCardThemeResponse {
  bool success = 1;
}

message QrMemory {
  string id = 1;
  string engravingId = 2;
  string qrCode = 3;
  string cardTitle = 4;
  string greetingMessage = 5;
  string recipientEmail = 6;
  string biometricDisplaySettings = 7;
  string accessPinHash = 8;
  bool isLocked = 9;
  string createdAt = 10;
  string updatedAt = 11;
  CardTheme cardTheme = 12;
}

message UpdateQrMemoryRequest {
  string engravingId = 1;
  string cardTitle = 2;
  string greetingMessage = 3;
  string recipientEmail = 4;
  string cardThemeId = 5;
  string customImages = 6;
  string biometricDisplaySettings = 7;
}

message UpdateQrMemoryResponse { QrMemory qrMemory = 1; }

message GetQrMemoryRequest { string engravingId = 1; }
message GetQrMemoryResponse { QrMemory qrMemory = 1; }

message ActivateQrMemoryRequest {
  string qrCode = 1;
  string accessPin = 2;
}

message ActivateQrMemoryResponse { QrMemory qrMemory = 1; }

// === MF-05: Delivery, Pickup & QR Memory ===
message QcAcceptOrderRequest {
  string orderId = 1;
  string result = 2;        // PASS | FAIL
  string checklist = 3;     // JSON
  repeated string proofImages = 4;
  string note = 5;
  string managerId = 6;
}

message InitiateDeliveryRequest {
  string orderId = 1;
  string deliveryMethod = 2;  // PICKUP | DELIVERY
  string recipientName = 3;
  string recipientPhone = 4;
  string addressId = 5;
  string shippingAddressText = 6;
  string assignedDeliveryStaffId = 7;
  string managerId = 8;
}

message DeliveryResponse {
  string id = 1;
  string orderId = 2;
  string deliveryMethod = 3;
  string status = 4;
  string trackingCode = 5;
  string trackingUrl = 6;
  string recipientName = 7;
  string recipientPhone = 8;
  string shippingAddressText = 9;
  string estimatedDeliveryAt = 10;
  string deliveredAt = 11;
  string createdAt = 12;
}

message UpdateShipmentStatusRequest {
  string orderId = 1;
  string status = 2;          // SHIPPING | DELIVERED
  string receiverName = 3;
  string receiverPhone = 4;
  string identityNote = 5;
  string proofImageUrl = 6;
  string trackingCode = 7;
  string staffId = 8;
}

message GetDeliveryInfoRequest { string orderId = 1; }

message GetWarrantyInfoRequest { string orderId = 1; }

message WarrantyResponse {
  string id = 1;
  string engravingId = 2;
  string orderId = 3;
  string warrantyCode = 4;
  string warrantyType = 5;
  string issueDate = 6;
  string expiryDate = 7;
  string activatedAt = 8;
  string status = 9;
  string warrantyScope = 10;
}

message GetProductionInfoRequest { string orderId = 1; }

message GetProductionInfoResponse {
  ProductionTask task = 1;
  QaCheck qaCheck = 2;
}

message QaCheck {
  string id = 1;
  string orderId = 2;
  string result = 3;
  string checklist = 4;
  repeated string proofImages = 5;
  string note = 6;
  string checkedAt = 7;
  string checkedByManagerId = 8;
}

message OrderLookupRequest { string orderCode = 1; }

// === MF-04: Guest (Walk-in) ===
message GuestCustomer {
  string id = 1;
  string guestCode = 2;
  string fullName = 3;
  string phone = 4;
  string email = 5;
  string note = 6;
  string createdAt = 7;
}

message CreateGuestSessionRequest {
  string fullName = 1;
  string phone = 2;
  string email = 3;
  string note = 4;
  string staffId = 5;
}

message CreateGuestSessionResponse {
  GuestCustomer guest = 1;
}

message CreateGuestOrderRequest {
  string guestCustomerId = 1;
  string productId = 2;
  string staffId = 3;
}

message CreateGuestOrderResponse {
  Order order = 1;
  Engraving engraving = 2;
  EngravingVersion version = 3;
}

message GetGuestSessionRequest {
  string guestCode = 1;
}

message GetGuestSessionResponse {
  GuestCustomer guest = 1;
  Order order = 2;
}

message GuestSubmitOrderRequest {
  string orderId = 1;
  string guestCode = 2;
}

message GuestSubmitOrderResponse {
  Order order = 1;
  bool isResubmit = 2;
}

message GuestUpdateEngravingConfigRequest {
  string engravingVersionId = 1;
  string guestCode = 2;
  string selectedMaterialId = 3;
  string selectedGemstoneId = 4;
  string ringSize = 5;
  string ringStyle = 6;
  string ringShape = 7;
  string customizationConfig = 8;
  string selectedBiometrics = 9;
}

message GuestUpdateEngravingConfigResponse {
  EngravingVersion version = 1;
}

message GuestUpdateQrMemoryRequest {
  string engravingId = 1;
  string guestCode = 2;
  string cardTitle = 3;
  string greetingMessage = 4;
  string recipientEmail = 5;
  string cardThemeId = 6;
  string customImages = 7;
  string biometricDisplaySettings = 8;
}

message GuestUpdateQrMemoryResponse {
  QrMemory qrMemory = 1;
}

message GuestGetOrderRequest {
  string orderId = 1;
  string guestCode = 2;
}

message GuestInitiatePaymentRequest {
  string orderId = 1;
  string guestCode = 2;
  string paymentPhase = 3;
  string returnUrl = 4;
  string cancelUrl = 5;
}

message GuestInitiatePaymentResponse {
  Payment payment = 1;
  string paymentUrl = 2;
}

// MF-04 Guest Shipping Info — guest chọn delivery method + nhập địa chỉ trên tablet
message GuestSetShippingInfoRequest {
  string orderId = 1;
  string guestCode = 2;
  string deliveryMethod = 3;  // PICKUP | DELIVERY
  string recipientName = 4;
  string recipientPhone = 5;
  string addressId = 6;         // optional, nếu có address trong system
  string shippingAddressText = 7;  // địa chỉ text nếu không có addressId
}

message GuestSetShippingInfoResponse {
  string id = 1;
  string orderId = 2;
  string deliveryMethod = 3;
  string status = 4;           // luôn PENDING
  string recipientName = 5;
  string recipientPhone = 6;
  string shippingAddressText = 7;
}

// === Admin Dashboard (P5) ===
message DashboardSummaryResponse {
  int32 totalOrders = 1;
  int32 completedOrders = 2;
  double totalRevenue = 3;
  int32 activeUsers = 4;
}

message OrdersByStatusResponse {
  message StatusCount {
    string status = 1;
    int32 count = 2;
  }
  repeated StatusCount data = 1;
}

message RevenueTimelineRequest {
  int32 days = 1;
}

message RevenueTimelineResponse {
  message DayRevenue {
    string date = 1;
    double revenue = 2;
  }
  repeated DayRevenue data = 1;
}

message TopProductsRequest {
  int32 limit = 1;
}

message TopProductsResponse {
  message ProductSales {
    string id = 1;
    string name = 2;
    int32 orderCount = 3;
  }
  repeated ProductSales data = 1;
}


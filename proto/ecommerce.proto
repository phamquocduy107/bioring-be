  int32 page = 2;
  int32 limit = 3;
}

message GetMyWarrantyClaimsResponse {
  repeated WarrantyClaim data = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 lastPage = 5;
}


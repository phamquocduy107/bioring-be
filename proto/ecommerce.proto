// === MF-06: Warranty & Service Claim ===
message WarrantyClaim {
  string id = 1;
  string claimCode = 2;
  string warrantyId = 3;
  string orderId = 4;
  string engravingId = 5;
  string serviceType = 6;
  string issueDescription = 7;
  repeated string proofImages = 8;
  string status = 9;
  string chargeStatus = 10;
  double extraFee = 11;
  string managerNote = 12;
  string customerConfirmedAt = 13;
  string createdAt = 14;
  string updatedAt = 15;
  repeated ServiceTicketMessage serviceTickets = 16;
}

message ServiceTicketMessage {
  string id = 1;
  string ticketCode = 2;
  string warrantyClaimId = 3;
  string assignedStaffId = 4;
  string assignedJewelerId = 5;
  string assignedJewelerName = 6;
  string status = 7;
  string receivedProductAt = 8;
  string serviceCompletedAt = 9;
  string resultNote = 10;
  double costUpdate = 11;
}

message CreateWarrantyClaimRequest {
  string warrantyId = 1;
  string orderId = 2;
  string serviceType = 3;
  string issueDescription = 4;
  repeated string proofImages = 5;
  repeated string proofVideos = 6;
  string userId = 7;
}

message CreateWarrantyClaimByLookupRequest {
  string orderCode = 1;
  string serviceType = 2;
  string issueDescription = 3;
  repeated string proofImages = 4;
  repeated string proofVideos = 5;
}

message CreateWarrantyClaimResponse {
  WarrantyClaim claim = 1;
}

message GetWarrantyClaimRequest {
  string id = 1;
}

message GetWarrantyClaimResponse {
  WarrantyClaim claim = 1;
}

message GetMyWarrantyClaimsRequest {
